name: heyat-survey
services:
  survey:
    build: .
    image: heyat-survey:local
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3000
      DATA_DIR: /app/data
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:?Run npm run setup first}
      SESSION_SECRET: ${SESSION_SECRET:?Run npm run setup first}
      BASE_PATH: ${BASE_PATH:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      TRUST_PROXY: ${TRUST_PROXY:-false}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${SURVEY_PORT:-7480}:3000"
    volumes:
      - survey_data:/app/data
      - survey_backups:/app/backups
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    healthcheck:
      test: ["CMD", "node", "-e", "const p=process.env.BASE_PATH||'';fetch('http://127.0.0.1:3000'+(p.endsWith('/')?p.slice(0,-1):p)+'/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
volumes:
  survey_data:
  survey_backups:
