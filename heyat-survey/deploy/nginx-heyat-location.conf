# Insert inside the EXISTING skill-up.ir server block (HTTP and HTTPS if both exist).
# Do not replace the existing Skill Up location /.
# .env: BASE_PATH=/heyat PUBLIC_BASE_URL=https://skill-up.ir TRUST_PROXY=true
location = /heyat {
    return 308 /heyat/;
}
location ^~ /heyat/ {
    proxy_pass http://127.0.0.1:4175;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    client_max_body_size 32k;
    proxy_read_timeout 60s;
}
