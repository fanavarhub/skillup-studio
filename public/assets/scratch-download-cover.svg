    <text x="90" y="178" font-size="34" font-weight="800">مجله اسکیل آپ</text>
    <text x="90" y="255" font-size="57" font-weight="900">دانلود اسکرچ</text>
    <text x="90" y="320" font-size="36" font-weight="800">+ آموزش نصب</text>
    <text x="90" y="375" font-size="24" font-weight="600" opacity=".88">ویندوز، اندروید و Google Play</text>
