<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">دانلود اسکرچ و آموزش نصب در اسکیل آپ</title>
  <desc id="desc">تصویر رنگی شامل گربه اسکرچ، بلوک‌های برنامه‌نویسی و لپ‌تاپ</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#6d28d9"/><stop offset=".55" stop-color="#4f46e5"/><stop offset="1" stop-color="#0284c7"/></linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-opacity=".25"/></filter>
  </defs>
  <rect width="1200" height="630" rx="48" fill="url(#bg)"/>
  <circle cx="1030" cy="90" r="150" fill="#f0abfc" opacity=".2"/><circle cx="150" cy="570" r="190" fill="#fcd34d" opacity=".18"/>
  <g filter="url(#shadow)">
    <rect x="655" y="105" width="430" height="365" rx="34" fill="#fff"/>
    <rect x="685" y="145" width="370" height="270" rx="22" fill="#eef2ff"/>
    <path d="M710 475h320l65 55H645z" fill="#c7d2fe"/>
    <g fill="none" stroke="#f97316" stroke-width="18" stroke-linecap="round" stroke-linejoin="round">
      <path d="M822 290l-32-56 58 16 43-42 11 59c39 15 67 52 67 96 0 20-6 38-16 54H767a102 102 0 01-15-54c0-31 14-58 36-77"/>
      <path d="M817 330h2m81 0h2"/>
